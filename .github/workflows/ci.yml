name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frontend syntax
        run: |
          node --check app.js
          node --check production.js
          node --check intelligence.js
          node --check platform.js
          node --check fallback.js
          node --check web3/tether-wdk.example.mjs
          python -m py_compile scripts/refresh_news.py
          python -m json.tool data/news.json >/dev/null
          python -m json.tool data/grants.json >/dev/null
          python -m json.tool data/institutional-controls.json >/dev/null
          grep -q "CryptoPilot" index.html
      - name: Worker dependencies and tests
        working-directory: worker
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
