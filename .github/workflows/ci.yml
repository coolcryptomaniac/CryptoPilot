name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frontend syntax and UI integrity
        run: |
          node --check app.js
          node --check production.js
          node --check intelligence.js
          node --check platform.js
          node --check v23.js
          node --check v23-runtime.js
          node --check hyperliquid-trade.js
          node --check fallback.js
          node --check ramp.js
          node --check checkout/cryptopilot-checkout.js
          node --check checkout/standalone.js
          node --check web3/tether-wdk.example.mjs
          python -m py_compile scripts/refresh_news.py scripts/check_ui.py
          python scripts/check_ui.py
          python -m json.tool data/news.json >/dev/null
          python -m json.tool data/grants.json >/dev/null
          python -m json.tool data/institutional-controls.json >/dev/null
          test -s v23.css
          test -s AGENTS.md
          test -s CLAUDE.md
          test -s checkout/index.html
          test -s checkout/README.md
          grep -q "CryptoPilot" index.html
      - name: Worker dependencies and tests
        working-directory: worker
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
