name: Refresh Crypto News
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_news.py'
      - '.github/workflows/refresh-news.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: refresh-crypto-news
  cancel-in-progress: true
jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh publisher RSS cache
        run: python scripts/refresh_news.py
      - name: Commit changed headlines
        run: |
          if git diff --quiet -- data/news.json; then
            echo 'No news changes.'
          else
            git config user.name 'cryptopilot-news-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add data/news.json
            git commit -m 'chore: refresh crypto news headlines'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Build current static site with fresh headlines
        run: |
          mkdir -p _site/data
          cp index.html app.js production.js intelligence.js platform.js v23.js v23-runtime.js hyperliquid-trade.js fallback.js ramp.js v23.css manifest.webmanifest _site/
          cp data/*.json _site/data/
          sed -i 's#</head>#<link rel="stylesheet" href="v23.css"></head>#' _site/index.html
          sed -i 's#</body>#<script src="production.js"></script><script src="intelligence.js"></script><script src="platform.js"></script><script src="v23.js"></script><script src="v23-runtime.js"></script><script src="hyperliquid-trade.js"></script><script src="fallback.js"></script></body>#' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy fresh headlines to Pages
        id: deployment
        uses: actions/deploy-pages@v4
