name: Refresh Crypto News
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_news.py'
      - '.github/workflows/refresh-news.yml'
permissions:
  contents: write
concurrency:
  group: refresh-crypto-news
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh publisher RSS cache
        run: python scripts/refresh_news.py
      - name: Commit changed headlines
        run: |
          if git diff --quiet -- data/news.json; then
            echo 'No news changes.'
            exit 0
          fi
          git config user.name 'cryptopilot-news-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/news.json
          git commit -m 'chore: refresh crypto news headlines'
          git push
