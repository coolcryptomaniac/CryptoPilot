name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          mkdir -p _site/data
          cp index.html app.js production.js intelligence.js platform.js v23.js v23-runtime.js hyperliquid-trade.js fallback.js ramp.js v23.css manifest.webmanifest _site/
          cp -R checkout _site/checkout
          cp data/*.json _site/data/
          sed -i 's#</head>#<link rel="stylesheet" href="v23.css"></head>#' _site/index.html
          sed -i 's#</body>#<script src="production.js"></script><script src="intelligence.js"></script><script src="platform.js"></script><script src="v23.js"></script><script src="v23-runtime.js"></script><script src="hyperliquid-trade.js"></script><script src="fallback.js"></script></body>#' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
