openapi: 3.1.0
info:
  title: CryptoPilot API
  version: 2.3.0
  description: >-
    Risk-gated crypto intelligence API. Developer API access does not expose user
    exchange credentials and does not authorize trades, withdrawals, custody or investment advice.
servers:
  - url: https://YOUR-CRYPTOPILOT-WORKER.workers.dev
security:
  - CryptoPilotKey: []
paths:
  /v1/news:
    get:
      summary: Curated crypto news
      parameters:
        - {name: source, in: query, schema: {type: string, default: all}}
        - {name: q, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 30}}
      responses:
        '200': {description: Curated headlines and short excerpts}
  /v1/grants:
    get:
      summary: Crypto grant and accelerator readiness radar
      parameters:
        - {name: ecosystem, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
      responses:
        '200': {description: Programs, readiness evidence and missing gaps}
  /v1/integrations:
    get:
      summary: Integration capability registry
      responses:
        '200': {description: Current and target infrastructure integrations}
  /v1/hyperliquid/mids:
    get:
      summary: Hyperliquid public mid prices
      description: Public market data normalized by CryptoPilot. Does not authorize or place Hyperliquid orders.
      responses:
        '200': {description: Hyperliquid allMids market data}
  /v1/rwa/pools:
    get:
      summary: Active Centrifuge RWA pools
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Read-only RWA pool and token data}
  /v1/defi/protocols:
    get:
      summary: DeFi protocol context
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200': {description: DefiLlama-derived protocol and TVL context}
  /v1/prediction/markets:
    get:
      summary: Public Kalshi prediction-market data
      description: Signal/data only. CryptoPilot does not expose authenticated Kalshi order placement here.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: series_ticker, in: query, schema: {type: string}}
      responses:
        '200': {description: Public market discovery data}
  /v1/oracle/pyth:
    get:
      summary: Pyth Core latest price updates
      description: Requires the CryptoPilot operator to configure a Pyth API key.
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: array, maxItems: 20, items: {type: string}}
          style: form
          explode: true
      responses:
        '200': {description: Pyth Hermes response}
  /v1/risk/quote:
    post:
      summary: Deterministic risk score and limits
      description: Does not authorize execution and is not investment advice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                style: {type: string, enum: [Conservative, Balanced, Aggressive], default: Balanced}
                networth: {type: number, minimum: 0, default: 50000}
                drawdown: {type: number, minimum: 0, maximum: 100, default: 18}
                singleCap: {type: number, minimum: 1, maximum: 100, default: 28}
      responses:
        '200': {description: Risk score and operator-bounded limits}
  /api/investor/summary:
    get:
      security: []
      summary: Aggregate non-binding investor interest
      description: Returns only aggregate EOI totals/counts. Never represents funded or verified committed capital.
      responses:
        '200': {description: Aggregate non-binding interest}
  /api/investor/interest:
    post:
      security: []
      summary: Submit a non-binding investor expression of interest
      description: No funds are accepted. Requires explicit risk, non-binding, NDA/disclosure and founder-contact sharing acknowledgements.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name,amountUsd,email,phone,country,city,method,riskAcknowledged,nonBindingAcknowledged,ndaRequested,contactConsent]
              properties:
                name: {type: string, maxLength: 120}
                amountUsd: {type: number, minimum: 1000000, maximum: 100000000000}
                email: {type: string, format: email}
                phone: {type: string, maxLength: 60}
                country: {type: string, maxLength: 80}
                city: {type: string, maxLength: 80}
                method: {type: string, enum: [Crypto, Bank transfer, Credit card, Cash / other regulated settlement, Other]}
                methodDetail: {type: string, maxLength: 120}
                riskAcknowledged: {type: boolean, const: true}
                nonBindingAcknowledged: {type: boolean, const: true}
                ndaRequested: {type: boolean, const: true}
                contactConsent: {type: boolean, const: true}
      responses:
        '201': {description: EOI encrypted/stored; optional founder notification attempted}
components:
  securitySchemes:
    CryptoPilotKey:
      type: apiKey
      in: header
      name: X-CryptoPilot-Key
