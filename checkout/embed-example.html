<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CryptoPilot Checkout embed example</title><style>body{font-family:system-ui;margin:30px;background:#f4f6fa}.card{max-width:900px;margin:auto}.frame{width:100%;height:760px;border:0;border-radius:24px;background:#080a0f}</style></head><body><main class="card"><h1>Hosted iframe integration</h1><p>The parent sends wallet/email at runtime instead of putting them into the iframe URL.</p><iframe id="checkout" class="frame" title="Crypto checkout" src="./?embed=1"></iframe></main><script>const frame=document.getElementById('checkout');const checkoutOrigin=new URL(frame.src,location.href).origin;frame.addEventListener('load',()=>frame.contentWindow.postMessage({type:'cryptopilot-checkout:init',options:{apiBase:'https://YOUR-WORKER.workers.dev',brand:'My App',theme:'dark',accent:'#7cf7c4',amountInr:1000,token:'USDC',chainId:'137',walletAddress:'0x0000000000000000000000000000000000000000',source:'my-github-project'}},checkoutOrigin));window.addEventListener('message',event=>{if(event.origin!==checkoutOrigin)return;if(event.data?.type==='cryptopilot-checkout:complete')console.log('Checkout complete',event.data.detail)});</script></body></html>
